openapi: 3.0.3
info:
  title: pubky-http-relay
  description: |
    An HTTP relay for asynchronous message passing with store-and-forward semantics.

    **Two endpoint groups are available:**
    - `/inbox/{id}` - **Recommended.** Store-and-forward with explicit ACK support
    - `/link/{id}` - **Deprecated.** Synchronous producer/consumer pairing

    ## Inbox API (recommended)

    The inbox API provides at-least-once delivery with explicit acknowledgment:

    1. **Producer** stores a message with `POST /inbox/{id}`
    2. **Consumer** retrieves it with `GET /inbox/{id}`
    3. **Consumer** acknowledges with `DELETE /inbox/{id}`
    4. **Producer** waits for ACK with `GET /inbox/{id}/await` (or polls `/ack`)

    Messages persist for 5 minutes (configurable) until acknowledged. The consumer
    can retry `GET` after connection drops and still receive the message. The
    producer knows delivery succeeded only after the consumer explicitly ACKs.

    This pattern is mobile-friendly: if the app is backgrounded or killed, the
    message remains available for retry, and the producer can detect timeouts.

    ## Errors

    Error responses have a short `text/plain` body: `ID too long` (400),
    `Invalid X-Forwarded-For header` (400), `Not found` (404), `Request timed out` (408), `Too many unacknowledged
    messages from this client` (429), `Too many concurrent requests` (503),
    `Server at capacity` (503) or `Storage error` (500).
  version: 0.6.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /inbox/{id}:
    post:
      summary: Store a message
      description: |
        Store a message in the inbox. Any existing message for this ID is
        overwritten. The message persists for 5 minutes (configurable) or
        until acknowledged via DELETE.

        The producer typically follows this with `GET /inbox/{id}/await` to
        wait for the consumer's acknowledgment.
      operationId: inboxPost
      tags:
        - inbox
      parameters:
        - $ref: '#/components/parameters/inboxId'
      requestBody:
        $ref: '#/components/requestBodies/Message'
      responses:
        '200':
          description: Message stored successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/ClientMessageLimitReached'
        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          $ref: '#/components/responses/ServerAtCapacity'

    get:
      summary: Retrieve a message (long-poll)
      description: |
        Retrieve a message from the inbox using long-polling. If a message is
        available, returns immediately with the payload. If no message exists,
        waits up to 25 seconds (configurable via --inbox-timeout) for one to
        arrive.

        The message remains in the inbox until explicitly acknowledged with
        DELETE. Multiple GET requests return the same message (at-least-once
        delivery).

        This eliminates the need for client-side polling - the consumer simply
        calls GET and waits.
      operationId: inboxGet
      tags:
        - inbox
      parameters:
        - $ref: '#/components/parameters/inboxId'
      responses:
        '200':
          $ref: '#/components/responses/InboxMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          description: No message arrived within timeout (25s default)
        '429':
          $ref: '#/components/responses/ClientWaitingLimitReached'
        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          $ref: '#/components/responses/TooManyWaiters'

    delete:
      summary: Acknowledge a message
      description: |
        Acknowledge receipt of a message, removing it from the inbox.

        This signals to the producer (waiting on `/await`) that the message
        was successfully received and processed.
      operationId: inboxDelete
      tags:
        - inbox
      parameters:
        - $ref: '#/components/parameters/inboxId'
      responses:
        '200':
          description: Message acknowledged and removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No message to acknowledge (not posted yet, or expired)
        '500':
          $ref: '#/components/responses/StorageError'

  /inbox/{id}/ack:
    get:
      summary: Check ACK status
      description: |
        Check whether a message has been acknowledged.

        Returns "true" if the message was acknowledged (DELETEd),
        "false" if the message exists but hasn't been acknowledged yet,
        or 404 if no message exists (not posted yet, expired, or deleted after
        the ACK to make room in a full store).

        Use this for polling scenarios. For blocking behavior, use `/await`,
        which always sees the ACK while it waits.
      operationId: inboxAckStatus
      tags:
        - inbox
      parameters:
        - $ref: '#/components/parameters/inboxId'
      responses:
        '200':
          description: ACK status
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - 'true'
                  - 'false'
              example: 'false'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No message exists for this ID
        '500':
          $ref: '#/components/responses/StorageError'

  /inbox/{id}/await:
    get:
      summary: Wait for acknowledgment
      description: |
        Block until the message is acknowledged or timeout is reached.

        The producer calls this after POST to wait for the consumer's DELETE.
        Default timeout is 25 seconds (compatible with proxy timeouts).

        Returns 200 when acknowledged, 408 on timeout, and 404 if no message
        exists, or if it expires or a new message replaces it while waiting.
      operationId: inboxAwait
      tags:
        - inbox
      parameters:
        - $ref: '#/components/parameters/inboxId'
      responses:
        '200':
          description: Message was acknowledged
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No message exists, or it expired or was replaced while waiting
        '408':
          description: Timeout waiting for acknowledgment (default 25s)
        '429':
          $ref: '#/components/responses/ClientWaitingLimitReached'
        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          $ref: '#/components/responses/TooManyWaiters'

  /link/{id}:
    get:
      summary: Consume a message (deprecated)
      deprecated: true
      description: |
        **Deprecated.** Use `/inbox` endpoints for new integrations.

        Consumer retrieves a message from the channel. Blocks until a producer
        sends data or the timeout (10 minutes) is reached.
      operationId: linkGet
      tags:
        - link
      parameters:
        - $ref: '#/components/parameters/channelId'
      responses:
        '200':
          $ref: '#/components/responses/MessageReceived'
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/Timeout'
        '429':
          $ref: '#/components/responses/ClientWaitingLimitReached'
        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          $ref: '#/components/responses/TooManyWaiters'

    post:
      summary: Produce a message (deprecated)
      deprecated: true
      description: |
        **Deprecated.** Use `/inbox` endpoints for new integrations.

        Producer sends a message to the channel. Blocks until a consumer
        retrieves the data or the timeout (10 minutes) is reached.
      operationId: linkPost
      tags:
        - link
      parameters:
        - $ref: '#/components/parameters/channelId'
      requestBody:
        $ref: '#/components/requestBodies/Message'
      responses:
        '200':
          $ref: '#/components/responses/MessageDelivered'
        '404':
          description: Another producer replaced the message before a consumer received it
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/Timeout'
        '429':
          description: |
            This client already has the maximum number of unacknowledged
            messages stored (see `ClientMessageLimitReached`, sent with
            `Retry-After`), or of waiting requests (see
            `ClientWaitingLimitReached`, sent without it). The message is not
            stored.
          headers:
            Retry-After:
              description: |
                Only when the client has too many unacknowledged messages
                stored; see `ClientMessageLimitReached`.
              schema:
                type: integer
                minimum: 1
          content:
            text/plain:
              schema:
                type: string
              examples:
                storedMessages:
                  value: Too many unacknowledged messages from this client
                waitingRequests:
                  value: Too many waiting requests from this client
        '500':
          $ref: '#/components/responses/StorageError'
        '503':
          description: |
            Server at capacity (see `ServerAtCapacity`), or too many requests
            already wait for this ID (see `TooManyWaiters`).
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Server at capacity
                  - Too many concurrent requests

components:
  parameters:
    inboxId:
      name: id
      in: path
      required: true
      description: |
        Channel identifier (max 256 bytes). The producer and consumer use the
        same ID to exchange messages.
      schema:
        type: string
        maxLength: 256
      example: my-channel

    channelId:
      name: id
      in: path
      required: true
      description: |
        Unique channel identifier (max 256 bytes). Producers and consumers
        using the same ID are paired.
      schema:
        type: string
        maxLength: 256
      example: my-channel

  requestBodies:
    Message:
      description: |
        Message payload (max 2KB). Content-Type is preserved and returned
        to the consumer.
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            maxLength: 2048
        application/json:
          schema:
            type: object
          example:
            hello: world
        text/plain:
          schema:
            type: string
          example: Hello, world!

  responses:
    InboxMessage:
      description: Message retrieved from inbox
      headers:
        Content-Type:
          description: Content-Type from the producer's request (if provided)
          schema:
            type: string
        Content-Security-Policy:
          description: |
            Always `sandbox`. The producer chooses the body and Content-Type,
            so browsers must not run relayed content as a page on the relay's
            origin. Doesn't affect `fetch()` or non-browser clients.
          schema:
            type: string
            enum: [sandbox]
        X-Content-Type-Options:
          description: Always `nosniff`, so browsers don't guess a different type.
          schema:
            type: string
            enum: [nosniff]
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            type: object
        text/plain:
          schema:
            type: string

    MessageReceived:
      description: Message successfully retrieved from producer
      headers:
        Content-Type:
          description: Content-Type from the producer's request (if provided)
          schema:
            type: string
        Content-Security-Policy:
          description: |
            Always `sandbox`. The producer chooses the body and Content-Type,
            so browsers must not run relayed content as a page on the relay's
            origin. Doesn't affect `fetch()` or non-browser clients.
          schema:
            type: string
            enum: [sandbox]
        X-Content-Type-Options:
          description: Always `nosniff`, so browsers don't guess a different type.
          schema:
            type: string
            enum: [nosniff]
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            type: object
        text/plain:
          schema:
            type: string

    MessageDelivered:
      description: Message successfully delivered to consumer

    Timeout:
      description: Timeout waiting for counterpart (producer or consumer)
      content:
        text/plain:
          schema:
            type: string
          example: Request timed out

    BadRequest:
      description: |
        The ID is longer than 256 bytes (`ID too long`), or the request comes
        from a trusted proxy (`--trusted-proxy`) without a valid
        `X-Forwarded-For` header (`Invalid X-Forwarded-For header`).
      content:
        text/plain:
          schema:
            type: string
          examples:
            idTooLong:
              value: ID too long
            invalidForwardedFor:
              value: Invalid X-Forwarded-For header

    TooManyWaiters:
      description: |
        Too many requests already wait for this ID, or too many IDs have
        waiting requests.
      content:
        text/plain:
          schema:
            type: string
          example: Too many concurrent requests

    ClientMessageLimitReached:
      description: |
        This client already has the maximum number of unacknowledged messages
        stored (`--max-entries-per-client`, 100 by default). A client is an
        IPv4 address or an IPv6 /56 network. The new message is not stored.
        Replacing one of the client's unacknowledged messages is still
        allowed. Retry
        after one of the client's messages is acknowledged or expires.
      headers:
        Retry-After:
          description: |
            Seconds until the client's first unacknowledged message expires,
            rounded up. An acknowledgement can make room sooner.
          schema:
            type: integer
            minimum: 1
      content:
        text/plain:
          schema:
            type: string
          example: Too many unacknowledged messages from this client

    ClientWaitingLimitReached:
      description: |
        This client already has the maximum number of waiting requests
        (`--max-entries-per-client`, 100 by default). Waiting requests are
        `GET /inbox/{id}`, `GET /inbox/{id}/await`, and both `/link/{id}`
        methods. A client is an IPv4 address or an IPv6 /56 network. Retry
        after one of the client's waiting requests ends. A `GET` for a message
        that is already stored doesn't wait and never gets this response.
      content:
        text/plain:
          schema:
            type: string
          example: Too many waiting requests from this client

    ServerAtCapacity:
      description: |
        The store is full and every entry still holds an undelivered message.
        The new message is not stored and existing messages are kept. Expired
        and acknowledged entries free up room, so retry later.
      content:
        text/plain:
          schema:
            type: string
          example: Server at capacity

    StorageError:
      description: The relay failed to read or write its storage
      content:
        text/plain:
          schema:
            type: string
          example: Storage error

tags:
  - name: inbox
    description: |
      Store-and-forward messaging with explicit ACK. Messages persist until
      acknowledged, enabling reliable delivery even when consumers disconnect.
  - name: link
    description: |
      Deprecated relay endpoints (10 min timeout, no caching). Use inbox instead.
