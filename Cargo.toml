[package]
name = "http-relay"
description = "A Rust implementation of _some_ of [Http relay spec](https://httprelay.io/)."
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
authors = ["SeverinAlexB"]
license = "MIT"
homepage = "https://github.com/pubky/http-relay"
repository = "https://github.com/pubky/http-relay"
keywords = ["httprelay", "http", "relay"]
categories = ["web-programming"]

[dependencies]
anyhow = "1.0.103"
bytes = "1"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
axum = "0.8.8"
axum-server = "0.8.0"
ipnet = "2"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
url = "2.5.8"

# Optional: persist feature
# `fallible_uint`: read and bind `usize` with a checked conversion.
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"], optional = true }

# Optional: CLI (binary only)
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = ["cli", "persist", "link-compat"]

# No effect: the server is always built. Kept so that dependents that enabled
# it still resolve.
server = []

# SQLite persistence (without this: in-memory HashMap storage)
persist = ["dep:rusqlite"]

# Legacy /link/{id} endpoint compatibility (deprecated)
link-compat = []

# CLI binary
cli = ["dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "http-relay"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
axum-test = "18.7.0"
