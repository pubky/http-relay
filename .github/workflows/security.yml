# Kept separate from ci.yml so a newly published advisory doesn't fail unrelated PRs.
# See SECURITY_REVIEW.md.
name: Security

on:
  push:
    branches: [main, master]
    paths: [Cargo.toml, Cargo.lock, deny.toml]
  pull_request:
    branches: [main, master]
    paths: [Cargo.toml, Cargo.lock, deny.toml]
  schedule:
    # Weekly, so new advisories surface even when the code doesn't change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
