# cargo-deny configuration. See SECURITY_REVIEW.md for how to run it and handle findings.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[advisories]
# Vulnerabilities, unsound and yanked crates always fail.
# Unmaintained crates fail too; a crate without maintainers won't get security fixes.
unmaintained = "all"
yanked = "deny"
# Every ignored advisory needs a reason, for example:
# { id = "RUSTSEC-0000-0000", reason = "Only affects X, which we don't use" },
ignore = []

[licenses]
# Permissive licenses compatible with distributing an MIT crate.
# Add a license here only after checking that it's permissive.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in the async ecosystem and rarely a security problem.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
